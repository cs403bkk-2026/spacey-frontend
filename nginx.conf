server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Traefik strips /app before forwarding, so this server sees /, /assets/..., /spaces/...
    location / {
        try_files $uri $uri/ /index.html;
    }
}
