name: test-build-deploy

# Platform-provided path (cs403bkk-2026/spacey#202). The Frontend team owns the
# application, its package scripts and its Dockerfile; this file only runs them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require an application
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json yet: the application has not been added." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: spacey-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-nomad@main

      - name: Confirm this is still the current main revision
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_revision="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_revision}" = "${GITHUB_SHA}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping superseded revision ${GITHUB_SHA}"
          fi

      # Without -detach, nomad job run waits for the deployment and fails if it
      # does not become healthy (auto_revert then restores the previous version).
      - name: Deploy the tested revision
        if: steps.freshness.outputs.deploy == 'true'
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: >-
          nomad job run
          -namespace=frontend
          -var="image=${IMAGE}"
          -var="hostname=${{ vars.APP_HOSTNAME }}"
          -var="revision=${{ github.sha }}"
          deploy/frontend.nomad.hcl

      - name: Check the public path
        if: steps.freshness.outputs.deploy == 'true'
        env:
          APP_URL: https://${{ vars.APP_HOSTNAME }}
        run: |
          curl --fail --silent --show-error --output /dev/null "${APP_URL}/app/"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${APP_URL}/app")" = "301"
